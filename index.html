<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <!-- Google Fonts for modern screen serif & clean sans UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #fdf6e3;       /* Warm cream / off-white background */
            --text-main: #2b303a;      /* Deep soft slate/charcoal */
            --text-muted: #657b83;     /* Muted slate for metadata & subtitles */
            --border-color: #e0d7c6;   /* Soft warm grey border */
            --code-bg: #f5eedc;        /* Tinted cream background for code blocks */
            --link-color: #268bd2;     /* Muted reading-friendly blue */
            --max-width: 680px;
            --font-serif: "Source Serif 4", Charter, Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 1.2rem;
            line-height: 1.75;
            padding: 4rem 1.25rem 6rem 1.25rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #content {
            width: 100%;
            max-width: var(--max-width);
        }

        /* Navigation Header & Footer / Back Button */
        .nav-header {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
        }

        .nav-footer {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .nav-header a, .nav-footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-header a:hover, .nav-footer a:hover {
            color: var(--text-main);
        }

        /* Index / Table of Contents Styling */
        .toc-container {
            font-family: var(--font-serif);
        }

        .toc-title {
            font-size: 2.35rem;
            font-weight: 700;
            margin-bottom: 0.75em;
            color: var(--text-main);
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .toc-intro {
            font-size: 1.2rem;
            line-height: 1.75;
            color: var(--text-main);
            margin-bottom: 1.6em;
        }

        .toc-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1.6em;
        }

        .toc-item {
            margin-bottom: 0.6em;
        }

        .toc-link {
            font-size: 1.2rem;
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .toc-link:hover {
            opacity: 0.8;
        }

        .toc-filename {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: 0.4rem;
        }

        /* Article Typography & Formatting */
        .article-date {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-top: -1.25em;
            margin-bottom: 2em;
            font-weight: 500;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.25;
            margin-top: 2.25em;
            margin-bottom: 0.75em;
            letter-spacing: -0.01em;
        }

        h1 { font-size: 2.35rem; margin-top: 0; }
        h2 { font-size: 1.7rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        h3 { font-size: 1.4rem; }
        h4 { font-size: 1.2rem; }

        p, ul, ol, blockquote, table, pre {
            margin-bottom: 1.6em;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        a:hover {
            opacity: 0.8;
        }

        ul, ol { padding-left: 1.5rem; }
        li { margin-bottom: 0.4em; }

        blockquote {
            border-left: 3px solid var(--text-muted);
            padding-left: 1.25rem;
            color: var(--text-muted);
            font-style: italic;
        }

        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.875em;
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }

        pre {
            background-color: var(--code-bg);
            padding: 1rem;
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 2.5em 0;
        }

        .status-msg {
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
            font-family: var(--font-sans);
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <main id="content"></main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentDiv = document.getElementById("content");
            const urlParams = new URLSearchParams(window.location.search);
            const mdUrl = urlParams.get("file");

            if (mdUrl) {
                loadArticle(mdUrl);
            } else {
                loadTableOfContents();
            }

            function loadTableOfContents() {
                fetch("index.json")
                    .then(res => {
                        if (!res.ok) throw new Error("index.json not found");
                        return res.json();
                    })
                    .then(files => renderTOC(files))
                    .catch(() => {
                        fetch(".")
                            .then(res => res.text())
                            .then(html => {
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(html, "text/html");
                                const links = Array.from(doc.querySelectorAll("a"))
                                    .map(a => a.getAttribute("href"))
                                    .filter(href => href && href.endsWith(".md"));
                                
                                if (links.length > 0) {
                                    renderTOC(links);
                                } else {
                                    renderFallbackPicker("No index.json found and automatic directory parsing returned no .md files.");
                                }
                            })
                            .catch(() => {
                                renderFallbackPicker("Unable to list directory automatically. Create an index.json file or select a file manually:");
                            });
                    });
            }

            function renderTOC(files) {
                let html = `
                    <div class="toc-container">
                        <h1 class="toc-title">Document Library</h1>
                        <p class="toc-intro">Welcome to the reader. Below is the full collection of available essays and system notes currently registered in the repository:</p>
                        <ul class="toc-list">`;

                files.forEach(file => {
                    const title = file
                        .replace(/\.md$/i, "")
                        .replace(/[-_]/g, " ")
                        .replace(/\b\w/g, c => c.toUpperCase());

                    html += `
                        <li class="toc-item">
                            <a class="toc-link" href="?file=${encodeURIComponent(file)}">${title}</a>
                            <span class="toc-filename">(${file})</span>
                        </li>`;
                });

                html += `</ul></div>`;
                contentDiv.innerHTML = html;
            }

            function loadArticle(url) {
                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        const lastModified = response.headers.get("Last-Modified");
                        const dateStr = lastModified ? new Date(lastModified).toLocaleDateString(undefined, {
                            year: 'numeric', month: 'long', day: 'numeric'
                        }) : null;

                        return response.text().then(markdown => ({ markdown, dateStr }));
                    })
                    .then(({ markdown, dateStr }) => {
                        let parsedHtml = marked.parse(markdown);
                        const finalDate = dateStr || new Date().toLocaleDateString(undefined, {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });

                        const dateHtml = `<div class="article-date">${finalDate}</div>`;
                        const navHeaderHtml = `<nav class="nav-header"><a href="?">&larr; Back to Library</a></nav>`;
                        const navFooterHtml = `<nav class="nav-footer"><a href="?">&larr; Back to Library</a></nav>`;

                        // Target the closing tag of the first heading (H1-H6) for consistent placement
                        if (/<h[1-6]>/i.test(parsedHtml)) {
                            parsedHtml = parsedHtml.replace(/<\/h[1-6]>/i, '$&' + dateHtml);
                        } else {
                            parsedHtml = dateHtml + parsedHtml;
                        }

                        contentDiv.innerHTML = navHeaderHtml + parsedHtml + navFooterHtml;
                    })
                    .catch(error => {
                        renderFallbackPicker(`Unable to load '${url}': ${error.message}`);
                    });
            }

            function renderFallbackPicker(message) {
                contentDiv.innerHTML = `
                    <div class="status-msg">
                        <p style="margin-bottom: 1rem;">${message}</p>
                        <input type="file" id="mdFileInput" accept=".md,.txt" style="margin-top: 0.5rem;" />
                    </div>`;

                document.getElementById("mdFileInput").addEventListener("change", (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            let parsedHtml = marked.parse(evt.target.result);
                            const finalDate = new Date(file.lastModified).toLocaleDateString(undefined, {
                                year: 'numeric', month: 'long', day: 'numeric'
                            });
                            const dateHtml = `<div class="article-date">${finalDate}</div>`;
                            const navHeaderHtml = `<nav class="nav-header"><a href="?">&larr; Back to Library</a></nav>`;
                            const navFooterHtml = `<nav class="nav-footer"><a href="?">&larr; Back to Library</a></nav>`;

                            if (/<h[1-6]>/i.test(parsedHtml)) {
                                parsedHtml = parsedHtml.replace(/<\/h[1-6]>/i, '$&' + dateHtml);
                            } else {
                                parsedHtml = dateHtml + parsedHtml;
                            }

                            contentDiv.innerHTML = navHeaderHtml + parsedHtml + navFooterHtml;
                        };
                        reader.readAsText(file);
                    }
                });
            }
        });
    </script>
</body>
</html>
