<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
:root {
    --bg-color: #fdf6e3;
    --text-main: #2b303a;
    --text-muted: #657b83;
    --border-color: #e0d7c6;
    --code-bg: #f5eedc;
    --link-color: #268bd2;
    --max-width: 680px;
    --font-serif: "Source Serif 4", Charter, Georgia, serif;
    --font-display: "Cormorant Garamond", Georgia, serif; /* Distinct title font */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 1.2rem;
            line-height: 1.75;
            padding: 4rem 1.25rem 6rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #content { width: 100%; max-width: var(--max-width); }
        
        .nav-slot { font-family: var(--font-sans); font-size: 0.875rem; min-height: 1.5rem; margin-bottom: 2.5rem; }
        .nav-footer { font-family: var(--font-sans); font-size: 0.875rem; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border-color); }
        .nav-slot a, .nav-footer a { color: var(--text-muted); text-decoration: none; }
        
.toc-title { 
    font-family: var(--font-display);
    font-size: 3.2rem;          /* Scaled up slightly to suit Cormorant's proportions */
    font-weight: 600;
    letter-spacing: -0.02em;    /* Tightened tracking for a sharp wordmark feel */
    line-height: 1.1;
    margin-bottom: 0.5em; 
    color: var(--text-main);
}
        .toc-intro { font-size: 1.2rem; margin-bottom: 2.5em; }
.toc-list { 
    list-style-type: none;  /* Removes bullet points */
    padding-left: 0;        /* Flushes links to the left margin */
}
.toc-item { 
    margin-bottom: 2.25em;  /* Slightly increased spacing between entries */
}
        .toc-link { font-size: 1.25rem; font-weight: 600; color: var(--link-color); text-decoration: none; }
        .toc-date { font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted); margin-left: 0.6rem; }
        .toc-date::before { content: "·"; margin-right: 0.6rem; font-weight: 700; opacity: 0.6; }
        .toc-blurb { font-size: 1.05rem; line-height: 1.5; margin-top: 0.1em; }
        
        .article-date { font-family: var(--font-sans); font-size: 0.9rem; color: var(--text-muted); margin-top: -1.25em; margin-bottom: 2em; }
        
        h1, h2, h3 { color: var(--text-main); font-weight: 700; margin-top: 2.25em; margin-bottom: 0.75em; }
        h1 { font-size: 2.35rem; margin-top: 0; }
        p, ul, ol, blockquote, pre { margin-bottom: 1.6em; }
        a { color: var(--link-color); text-decoration: none; }
        blockquote { border-left: 3px solid var(--text-muted); padding-left: 1.25rem; color: var(--text-muted); font-style: italic; }
        code { font-family: monospace; font-size: 0.875em; background-color: var(--code-bg); padding: 0.2em 0.4em; border-radius: 4px; }
        pre { background-color: var(--code-bg); padding: 1rem; overflow-x: auto; border-radius: 6px; border: 1px solid var(--border-color); }
        pre code { background-color: transparent; padding: 0; }
        
        .status-msg { color: var(--text-muted); font-size: 1rem; text-align: center; font-family: var(--font-sans); margin-top: 4rem; }
    </style>
</head>
<body>

    <main id="content"></main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.getElementById("content");
            const file = new URLSearchParams(window.location.search).get("file");

            file ? loadArticle(file) : loadIndex();

            function loadIndex() {
                fetch("index.json")
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(items => {
                        let html = `
                            <div class="nav-slot"></div>
                            <div>
                                <h1 class="toc-title">Longform</h1>
                                <p class="toc-intro">Welcome, dear Reader. Below you will find the full collection of available essays. Some will appeal to more technically interested readers, while others are of a more general nature and may appeal to a broader audience. Either way, my hope is that you will find something to your liking, or if not, come back at a later time to see what is new at that time.</p>
                                <ul class="toc-list">`;
                        
                        items.forEach(i => {
                            html += `
                                <li class="toc-item">
                                    <a class="toc-link" href="?file=${encodeURIComponent(i.file)}">${i.title}</a>
                                    ${i.date ? `<span class="toc-date">${i.date}</span>` : ''}
                                    ${i.blurb ? `<div class="toc-blurb">${i.blurb}</div>` : ''}
                                </li>`;
                        });
                        content.innerHTML = html + `</ul></div>`;
                    })
                    .catch(err => renderError(`Unable to load index.json: HTTP ${err}`));
            }

            function loadArticle(filename) {
                const cleanPath = filename.replace(/^(\.\/|\/)+/, '');
                
                Promise.all([
                    fetch(cleanPath).then(r => r.ok ? r.text() : Promise.reject(r.status)),
                    fetch("index.json").then(r => r.ok ? r.json() : []).catch(() => [])
                ])
                .then(([rawText, indexItems]) => {
                    // Strip front matter if present
                    const bodyText = rawText.trim().startsWith('---') ? rawText.split(/^---$/m).slice(2).join('---').trim() : rawText;
                    const meta = indexItems.find(i => i.file === cleanPath) || {};
                    const title = meta.title || cleanPath.replace(/\.md$/i, "").replace(/[-_]/g, " ");
                    const dateHtml = meta.date ? `<div class="article-date">${meta.date}</div>` : '';
                    
                    let parsedHtml = marked.parse(bodyText);
                    parsedHtml = /<h1[^>]*>/i.test(parsedHtml) 
                        ? parsedHtml.replace(/<\/h1>/i, '$&' + dateHtml) 
                        : `<h1>${title}</h1>${dateHtml}${parsedHtml}`;

                    content.innerHTML = `
                        <div class="nav-slot"><a href="?">&larr; Back to Library</a></div>
                        <div>${parsedHtml}</div>
                        <nav class="nav-footer"><a href="?">&larr; Back to Library</a></nav>`;
                })
                .catch(err => renderError(`Unable to load '${cleanPath}': HTTP ${err}`));
            }

            function renderError(msg) {
                content.innerHTML = `<div class="status-msg"><p>${msg}</p></div>`;
            }
        });
    </script>
</body>
</html>
