<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #fdf6e3;
            --text-main: #2b303a;
            --text-muted: #657b83;
            --border-color: #e0d7c6;
            --code-bg: #f5eedc;
            --link-color: #268bd2;
            --max-width: 680px;
            --font-serif: "Source Serif 4", Charter, Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 1.2rem;
            line-height: 1.75;
            padding: 4rem 1.25rem 6rem 1.25rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #content { width: 100%; max-width: var(--max-width); }
        
        .nav-slot { font-family: var(--font-sans); font-size: 0.875rem; min-height: 1.5rem; margin-bottom: 2.5rem; }
        .nav-footer { font-family: var(--font-sans); font-size: 0.875rem; margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border-color); }
        .nav-slot a, .nav-footer a { color: var(--text-muted); text-decoration: none; }
        
        .toc-title { font-size: 2.35rem; font-weight: 700; margin-bottom: 0.75em; }
        .toc-intro { font-size: 1.2rem; margin-bottom: 2.5em; }
        .toc-list { list-style-type: disc; padding-left: 1.5rem; }
        .toc-item { margin-bottom: 1.75em; }
        .toc-link { font-size: 1.25rem; font-weight: 600; color: var(--link-color); text-decoration: none; }
        .toc-date { font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted); margin-left: 0.6rem; }
        .toc-date::before { content: "·"; margin-right: 0.6rem; font-weight: 700; opacity: 0.6; }
        .toc-blurb { font-size: 1.05rem; line-height: 1.5; margin-top: 0.1em; }
        
        .article-date { font-family: var(--font-sans); font-size: 0.9rem; color: var(--text-muted); margin-top: -1.25em; margin-bottom: 2em; }
        
        h1, h2, h3 { color: var(--text-main); font-weight: 700; margin-top: 2.25em; margin-bottom: 0.75em; }
        h1 { font-size: 2.35rem; margin-top: 0; }
        p, ul, ol, blockquote, pre { margin-bottom: 1.6em; }
        a { color: var(--link-color); text-decoration: none; }
        blockquote { border-left: 3px solid var(--text-muted); padding-left: 1.25rem; color: var(--text-muted); font-style: italic; }
        code { font-family: monospace; font-size: 0.875em; background-color: var(--code-bg); padding: 0.2em 0.4em; border-radius: 4px; }
        pre { background-color: var(--code-bg); padding: 1rem; overflow-x: auto; border-radius: 6px; border: 1px solid var(--border-color); }
        pre code { background-color: transparent; padding: 0; }
        
        .status-msg { color: var(--text-muted); font-size: 1rem; text-align: center; font-family: var(--font-sans); margin-top: 4rem; }
    </style>
</head>
<body>

    <main id="content"></main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentDiv = document.getElementById("content");
            const fileParam = new URLSearchParams(window.location.search).get("file");

            if (fileParam) {
                loadArticle(fileParam);
            } else {
                loadIndex();
            }

            function loadIndex() {
                fetch("./index.json")
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(items => renderTOC(items))
                    .catch(err => renderError(`Unable to load index.json: ${err.message}`));
            }

            function renderTOC(items) {
                let html = `
                    <div class="nav-slot"></div>
                    <div>
                        <h1 class="toc-title">Document Library</h1>
                        <p class="toc-intro">Welcome to the reader. Below is the full collection of available essays and system notes:</p>
                        <ul class="toc-list">`;

                items.forEach(item => {
                    const dateDisplay = item.date ? `<span class="toc-date">${item.date}</span>` : '';
                    const blurbDisplay = item.blurb ? `<div class="toc-blurb">${item.blurb}</div>` : '';

                    html += `
                        <li class="toc-item">
                            <a class="toc-link" href="?file=${encodeURIComponent(item.file)}">${item.title}</a>
                            ${dateDisplay}
                            ${blurbDisplay}
                        </li>`;
                });

                html += `</ul></div>`;
                contentDiv.innerHTML = html;
            }

            function loadArticle(filename) {
                fetch(`./${filename}`)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(markdownText => {
                        // Find matching metadata from index.json for header injection
                        fetch("./index.json")
                            .then(res => res.ok ? res.json() : [])
                            .then(indexItems => {
                                const entry = indexItems.find(i => i.file === filename) || {};
                                renderArticle(markdownText, filename, entry.title, entry.date);
                            })
                            .catch(() => {
                                renderArticle(markdownText, filename);
                            });
                    })
                    .catch(err => renderError(`Unable to load '${filename}': ${err.message}`));
            }

            function renderArticle(markdownText, filename, indexTitle, indexDate) {
                let parsedHtml = marked.parse(markdownText);
                const fallbackTitle = filename.replace(/\.md$/i, "").replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase());
                const titleText = indexTitle || fallbackTitle;
                const dateHtml = indexDate ? `<div class="article-date">${indexDate}</div>` : '';

                if (/<h1[^>]*>/i.test(parsedHtml)) {
                    if (dateHtml) parsedHtml = parsedHtml.replace(/<\/h1>/i, '$&' + dateHtml);
                } else {
                    parsedHtml = `<h1>${titleText}</h1>` + dateHtml + parsedHtml;
                }

                contentDiv.innerHTML = `
                    <div class="nav-slot"><a href="?">&larr; Back to Library</a></div>
                    <div>${parsedHtml}</div>
                    <nav class="nav-footer"><a href="?">&larr; Back to Library</a></nav>`;
            }

            function renderError(msg) {
                contentDiv.innerHTML = `<div class="status-msg"><p>${msg}</p></div>`;
            }
        });
    </script>
</body>
</html>
