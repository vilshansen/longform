<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Longform — a collection of long-form essays and technical deep-dives.">
    <meta name="theme-color" content="#fdf6e3">
    <title>Longform</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fdf6e3'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%232b303a' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
    <!-- Open Graph / social sharing -->
    <meta property="og:site_name" content="Longform">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Longform">
    <meta property="og:description" content="A collection of long-form essays and technical deep-dives.">
    <meta property="og:url" content="/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Longform">
    <meta name="twitter:description" content="A collection of long-form essays and technical deep-dives.">
    <!-- Cormorant Garamond (Title) & Source Serif 4 (Body) — self-hosted -->
    <link rel="stylesheet" href="vendor/fonts.css">
    <!-- Marked.js (Markdown parser) & DOMPurify (HTML sanitizer) — vendored locally so the site works offline -->
    <script src="vendor/marked.min.js" defer></script>
    <script src="vendor/purify.min.js" defer></script>
    <style>
        :root {
            --bg-color: #fdf6e3;       /* Warm cream / off-white background */
            --text-main: #2b303a;      /* Deep soft slate/charcoal */
            --text-muted: #657b83;     /* Muted slate for metadata & subtitles */
            --border-color: #e0d7c6;   /* Soft warm grey border */
            --code-bg: #f5eedc;        /* Tinted cream background for code blocks */
            --link-color: #268bd2;     /* Muted reading-friendly blue */
            --max-width: 680px;
            --font-serif: "Source Serif 4", Charter, Georgia, serif;
            --font-display: "Cormorant Garamond", Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Dark theme — manual override (data-theme) or system preference */
        :root[data-theme="dark"] {
            --bg-color: #171b21;
            --text-main: #d7dde6;
            --text-muted: #8a94a3;
            --border-color: #323a46;
            --code-bg: #1f252e;
            --link-color: #6fb3e8;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #171b21;
                --text-main: #d7dde6;
                --text-muted: #8a94a3;
                --border-color: #323a46;
                --code-bg: #1f252e;
                --link-color: #6fb3e8;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            font-size: 1.2rem;
            line-height: 1.75;
            transition: background-color 0.25s ease, color 0.25s ease;
            padding: 4rem 1.25rem 6rem 1.25rem;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #content {
            width: 100%;
            max-width: var(--max-width);
        }

        /* Navigation Header / Back Button */
        .nav-header {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
        }

        .nav-header a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-header a:hover {
            color: var(--text-main);
        }

        /* Index / Table of Contents Styling */
        .toc-container {
            font-family: var(--font-serif);
        }

        .toc-title {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 0.5em;
            color: var(--text-main);
        }

        .toc-intro {
            font-size: 1.2rem;
            line-height: 1.75;
            color: var(--text-main);
            margin-bottom: 2.5em;
        }

        .toc-list {
            list-style-type: none;
            padding: 0;
            margin-bottom: 1.6em;
        }

        .toc-item {
            margin-bottom: 2em;
        }

        .toc-link {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .toc-link:hover {
            opacity: 0.8;
        }

        .toc-date {
            display: inline;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .toc-date::before {
            content: "·";
            display: inline-block;
            padding: 0 0.5em;
            font-weight: 700;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .toc-blurb {
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            margin-top: 0.1em;
        }

        /* Article Typography & Formatting */
        .article-meta {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-top: -1.25em;
            margin-bottom: 2em;
            font-weight: 500;
        }

        .article-meta .meta-sep {
            padding: 0 0.5em;
            opacity: 0.6;
        }

        .reading-time {
            font-weight: 400;
        }

        /* Heading anchor links */
        .heading-link {
            opacity: 0;
            margin-left: 0.3em;
            font-size: 0.8em;
            font-weight: 400;
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        h2:hover .heading-link,
        h3:hover .heading-link,
        h4:hover .heading-link,
        h5:hover .heading-link {
            opacity: 0.75;
        }

        /* Article bottom navigation — previous / back / next on one line */
        .article-pager {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-size: 0.9rem;
        }

        .article-pager .pager-slot {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article-pager .pager-prev { text-align: left; }
        .article-pager .pager-next { text-align: right; }

        .article-pager .pager-back {
            flex: 1;
            text-align: center;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .article-pager a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .article-pager a:hover { opacity: 0.8; }
        .article-pager .pager-back:hover { color: var(--text-main); }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.25;
            margin-top: 2.25em;
            margin-bottom: 0.75em;
            letter-spacing: -0.01em;
        }

        h1 { font-size: 2.35rem; margin-top: 0; }
        h2 { font-size: 1.7rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        h3 { font-size: 1.4rem; }
        h4 { font-size: 1.2rem; }

        p, ul, ol, blockquote, table, pre {
            margin-bottom: 1.6em;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        a:hover {
            opacity: 0.8;
        }

        ul, ol { padding-left: 1.5rem; }
        li { margin-bottom: 0.4em; }

        blockquote {
            border-left: 3px solid var(--text-muted);
            padding-left: 1.25rem;
            color: var(--text-muted);
            font-style: italic;
        }

        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.875em;
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }

        pre {
            background-color: var(--code-bg);
            padding: 1rem;
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 2.5em 0;
        }

        .status-msg {
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
            font-family: var(--font-sans);
            margin-top: 4rem;
        }

        /* Theme toggle button */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            z-index: 100;
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.25s ease;
        }

        .theme-toggle:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>

    <main id="content"></main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.getElementById("content");
            const fileParam = new URLSearchParams(window.location.search).get("file");

            // ---- Small helpers ------------------------------------------------
            // Escape text before interpolating it into innerHTML.
            const esc = (s) => String(s ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");

            // ---- Article discovery & metadata -----------------------------------
            // Static hosting can't enumerate files, so we ask the GitHub API for the
            // file list once and cache it locally (the API allows ~60 requests/hour).
            // Update these if the repo is renamed or moved.
            const REPO = "vilshansen/longform";
            const BRANCH = "main";
            const LIBRARY_KEY = "longform.library";
            const CACHE_TTL = 30 * 60 * 1000; // 30 minutes — keeps the per-file commits calls within the 60 req/hr API limit

            function readLibraryCache() {
                try {
                    const raw = storage.get(LIBRARY_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    return (Array.isArray(data.files) && data.dates && typeof data.dates === "object") ? data : null;
                } catch { return null; }
            }

            // Resolve the library: sorted root .md filenames + each file's last-commit
            // date (cached). GitHub Pages' Last-Modified header is the deploy time and
            // identical for every file, so real per-post timestamps come from the
            // per-file commits API instead.
            function fetchLibrary() {
                const cached = readLibraryCache();
                // ?refresh=1 bypasses the cache so a freshly-published post shows up immediately.
                const force = new URLSearchParams(window.location.search).has("refresh");
                if (!force && cached && Date.now() - cached.ts < CACHE_TTL) {
                    return Promise.resolve(cached);
                }

                return fetch(`https://api.github.com/repos/${REPO}/contents/?ref=${BRANCH}`)
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(entries => entries
                        .filter(e => e.type === "file" && /\.md$/i.test(e.name))
                        .map(e => e.name)
                        .sort())
                    .then(files => Promise.all(files.map(name =>
                        fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(name)}&sha=${BRANCH}&per_page=1`)
                            .then(r => r.ok ? r.json() : [])
                            .then(commits => {
                                const committer = commits[0] && commits[0].commit && commits[0].commit.committer;
                                return [name, committer ? committer.date : ""];
                            })
                            .catch(() => [name, ""])
                    )))
                    .then(pairs => {
                        const dates = {};
                        pairs.forEach(([name, iso]) => { if (iso) dates[name] = iso; });
                        const data = { ts: Date.now(), files: pairs.map(p => p[0]), dates };
                        storage.set(LIBRARY_KEY, JSON.stringify(data));
                        return data;
                    })
                    .catch(err => {
                        // Fall back to a stale cache rather than failing outright.
                        if (cached) return cached;
                        throw err;
                    });
            }

            // Title: capitalise each word of the filename, minus dashes/underscores.
            function titleFromFilename(name) {
                return name.replace(/\.md$/i, "")
                    .split(/[-_]+/)
                    .filter(Boolean)
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                    .join(" ");
            }

            function formatDate(date) {
                if (!date || isNaN(date.getTime())) return "";
                // Local time so the author sees their own wall-clock time.
                return date.toLocaleString("en-GB", {
                    day: "numeric", month: "short", year: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });
            }

            function truncate(text, max = 200) {
                if (!text) return "";
                return text.length > max ? text.slice(0, max - 1).trimEnd() + "…" : text;
            }

            // Blurb: front-matter `blurb:` wins; otherwise the first paragraph.
            function extractBlurb(parsedHtml, fallback = "") {
                if (fallback) return truncate(fallback);
                const tmp = document.createElement("div");
                tmp.innerHTML = parsedHtml;
                const p = tmp.querySelector("p");
                return truncate((p ? p.textContent : tmp.textContent || "").trim());
            }

            // Fetch one article and derive its metadata + parsed body.
            // `dates` maps filename -> ISO last-commit date (from fetchLibrary).
            function fetchArticleMeta(name, dates = {}) {
                return fetch(name)
                    .then(r => r.ok
                        ? r.text().then(text => ({ text, lastModified: r.headers.get("Last-Modified") }))
                        : Promise.reject(r.status))
                    .then(({ text, lastModified }) => {
                        const { meta, body } = splitFrontMatter(text);
                        const parsedHtml = (typeof marked !== "undefined") ? marked.parse(body) : "";
                        const title = meta.title || titleFromFilename(name);
                        const commitMs = dates[name] ? Date.parse(dates[name]) : 0;
                        const headerMs = lastModified ? new Date(lastModified).getTime() : 0;
                        // Precedence: front-matter date > last-commit date > Last-Modified header.
                        const dateMs = (meta.date ? (Date.parse(meta.date) || 0) : (commitMs || headerMs)) || 0;
                        const date = meta.date || (dateMs ? formatDate(new Date(dateMs)) : "");
                        const blurb = extractBlurb(parsedHtml, meta.blurb || meta.description);
                        return { file: name, title, date, dateMs, blurb, meta, body, parsedHtml };
                    });
            }

            // Newest-first ordering by full timestamp (Last-Modified / front matter).
            function sortByDate(items) {
                items.sort((a, b) => (b.dateMs || 0) - (a.dateMs || 0));
            }

            // Split optional YAML front matter from a Markdown document.
            // Robust to a missing front-matter block or a '---' appearing later in the body.
            function splitFrontMatter(rawText) {
                const text = rawText.replace(/^\uFEFF/, ""); // strip BOM
                if (!text.startsWith("---")) return { meta: {}, body: text };

                const end = text.indexOf("\n---", 3);
                if (end === -1) return { meta: {}, body: text };

                const meta = {};
                for (const line of text.slice(3, end).split(/\r?\n/)) {
                    const m = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
                    if (m) meta[m[1].toLowerCase()] = m[2].trim().replace(/^["']|["']$/g, "");
                }
                const body = text.slice(end + 4).replace(/^\r?\n/, "");
                return { meta, body };
            }

            function renderError(msg) {
                content.innerHTML = `<div class="status-msg" role="status"><p>${esc(msg)}</p></div>`;
            }

            // localStorage can throw (private mode / file://); guard it.
            const storage = {
                get(k) { try { return window.localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { window.localStorage.setItem(k, v); } catch { /* ignore */ } }
            };

            // Update document title + Open Graph / Twitter meta for the current view.
            function setMeta(title, description) {
                const setProp = (prop, val) => {
                    let el = document.querySelector(`meta[property="${prop}"]`);
                    if (!el) { el = document.createElement("meta"); el.setAttribute("property", prop); document.head.appendChild(el); }
                    el.setAttribute("content", val);
                };
                const setName = (name, val) => {
                    let el = document.querySelector(`meta[name="${name}"]`);
                    if (!el) { el = document.createElement("meta"); el.setAttribute("name", name); document.head.appendChild(el); }
                    el.setAttribute("content", val);
                };

                document.title = title === "Longform" ? "Longform" : `${title} — Longform`;
                setProp("og:title", title);
                setProp("og:url", location.href);
                setName("twitter:title", title);
                if (description) {
                    setProp("og:description", description);
                    setName("twitter:description", description);
                }
            }

            // ---- Theme (dark / light) ------------------------------------------
            const themeToggle = document.getElementById("theme-toggle");
            const isDark = () => {
                const root = document.documentElement;
                return root.getAttribute("data-theme") === "dark"
                    || (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            };

            function applyTheme(theme) {
                const root = document.documentElement;
                if (theme === "dark") root.setAttribute("data-theme", "dark");
                else if (theme === "light") root.setAttribute("data-theme", "light");
                else root.removeAttribute("data-theme");

                const dark = isDark();
                themeToggle.textContent = dark ? "☀" : "☾";
                themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");

                const tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.setAttribute("content", dark ? "#171b21" : "#fdf6e3");
            }

            function initTheme() {
                const saved = storage.get("theme");
                applyTheme(saved === "dark" || saved === "light" ? saved : null);
                themeToggle.addEventListener("click", () => {
                    applyTheme(isDark() ? "light" : "dark");
                    storage.set("theme", document.documentElement.getAttribute("data-theme") || "");
                });
            }

            // ---- Word count / reading time --------------------------------------
            function readingStats(html) {
                const tmp = document.createElement("div");
                tmp.innerHTML = html;
                tmp.querySelectorAll("pre, code").forEach(el => el.remove());
                const words = (tmp.textContent || "").trim().split(/\s+/).filter(Boolean).length;
                const minutes = Math.max(1, Math.round(words / 200));
                return { words, minutes };
            }

            // ---- Heading anchor links -------------------------------------------
            function addHeadingAnchors(scope) {
                const counts = {};
                scope.querySelectorAll("h2, h3, h4, h5").forEach(h => {
                    const base = h.textContent.trim().toLowerCase()
                        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
                    const slug = base || "section";
                    counts[slug] = (counts[slug] || 0) + 1;
                    const id = counts[slug] === 1 ? slug : `${slug}-${counts[slug]}`;
                    h.id = id;
                    const link = document.createElement("a");
                    link.className = "heading-link";
                    link.href = "#" + id;
                    link.textContent = "#";
                    link.setAttribute("aria-hidden", "true");
                    link.tabIndex = -1;
                    h.appendChild(link);
                });
            }

            // ---- Index / table of contents ------------------------------------
            async function loadIndex() {
                content.innerHTML = `<div class="status-msg" role="status"><p>Loading…</p></div>`;
                try {
                    const lib = await fetchLibrary();
                    const settled = await Promise.allSettled(lib.files.map(f => fetchArticleMeta(f, lib.dates)));
                    const items = settled.filter(s => s.status === "fulfilled").map(s => s.value);
                    sortByDate(items);
                    setMeta("Longform", "A collection of long-form essays and technical deep-dives.");

                    let html = `
                        <div class="toc-container">
                            <h1 class="toc-title">Longform</h1>
                            <p class="toc-intro">Welcome. Below is the full collection of essays, ranging from technical deep-dives to broader personal reflections. My hope is that you find something here that catches your eye. If not, feel free to check back later to see what's new.</p>
                            <ul class="toc-list">`;

                    items.forEach(i => {
                        const href = `?file=${encodeURIComponent(i.file)}`;
                        html += `
                            <li class="toc-item">
                                <a class="toc-link" href="${href}">${esc(i.title)}</a>${i.date ? `<span class="toc-date">${esc(i.date)}</span>` : ""}
                                ${i.blurb ? `<div class="toc-blurb">${esc(i.blurb)}</div>` : ""}
                            </li>`;
                    });
                    content.innerHTML = html + `</ul></div>`;
                } catch (err) {
                    renderError(`Unable to load the library: ${err.message || err}`);
                }
            }

            // ---- Single article -------------------------------------------------
            async function loadArticle(filename) {
                const cleanPath = filename.replace(/^(\.\/|\/)+/, "");
                content.innerHTML = `<div class="status-msg" role="status"><p>Loading…</p></div>`;
                try {
                    const lib = await fetchLibrary();
                    const settled = await Promise.allSettled(lib.files.map(f => fetchArticleMeta(f, lib.dates)));
                    const items = settled.filter(s => s.status === "fulfilled").map(s => s.value);
                    let current = items.find(i => i.file === cleanPath);
                    if (!current) { // allow direct access even if not yet in the cached list
                        current = await fetchArticleMeta(cleanPath);
                        items.push(current);
                    }
                    sortByDate(items);

                    if (typeof marked === "undefined") {
                        renderError("This page needs the Marked.js library to render, but it failed to load. Please reload.");
                        return;
                    }

                    const { title, date, blurb, parsedHtml } = current;

                    // Marked output is trusted only after DOMPurify strips scripts/event handlers.
                    let safeHtml = (typeof DOMPurify !== "undefined") ? DOMPurify.sanitize(parsedHtml) : parsedHtml;

                    const { words, minutes } = readingStats(safeHtml);
                    const metaParts = [];
                    if (date) metaParts.push(`<span class="article-date">${esc(date)}</span>`);
                    metaParts.push(`<span class="reading-time">${minutes} min read · ${words.toLocaleString("en-US")} words</span>`);
                    const metaHtml = `<div class="article-meta">${metaParts.join('<span class="meta-sep">·</span>')}</div>`;

                    safeHtml = /<h1[^>]*>/i.test(safeHtml)
                        ? safeHtml.replace(/<\/h1>/i, "$&" + metaHtml)
                        : `<h1>${esc(title)}</h1>${metaHtml}${safeHtml}`;

                    // Prev / Next / Back navigation (newest-first order), one compact line.
                    const idx = items.findIndex(i => i.file === cleanPath);
                    const prev = idx > 0 ? items[idx - 1] : null;
                    const next = idx >= 0 && idx < items.length - 1 ? items[idx + 1] : null;
                    let pagerHtml = `<nav class="article-pager" aria-label="Article navigation">`;
                    pagerHtml += `<span class="pager-slot pager-prev">`;
                    pagerHtml += prev
                        ? `<a href="?file=${encodeURIComponent(prev.file)}" title="Previous: ${esc(prev.title)}">&larr; ${esc(prev.title)}</a>`
                        : ``;
                    pagerHtml += `</span>`;
                    pagerHtml += `<a class="pager-back" href="?">Back to Library</a>`;
                    pagerHtml += `<span class="pager-slot pager-next">`;
                    pagerHtml += next
                        ? `<a href="?file=${encodeURIComponent(next.file)}" title="Next: ${esc(next.title)}">${esc(next.title)} &rarr;</a>`
                        : ``;
                    pagerHtml += `</span>`;
                    pagerHtml += `</nav>`;

                    content.innerHTML = `
                        <nav class="nav-header" aria-label="Article navigation"><a href="?">&larr; Back to Library</a></nav>
                        <article class="article-body">${safeHtml}</article>
                        ${pagerHtml}`;

                    addHeadingAnchors(content.querySelector(".article-body"));
                    setMeta(title, blurb);
                } catch (err) {
                    renderError(`Unable to load '${cleanPath}': ${err.message || err}`);
                }
            }

            initTheme();
            fileParam ? loadArticle(fileParam) : loadIndex();
        });
    </script>
</body>
</html>
